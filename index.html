// ── FIXED HIGH-PERFORMANCE VIDEO EXTRACTION ENGINE ──
async function extractSwingFrames(videoEl) {
  return new Promise(async (resolve, reject) => {
    // Force browser to wake up and map out the video matrix structure
    if (videoEl.readyState < 2) {
      await new Promise(r => videoEl.addEventListener('loadeddata', r, { once: true }));
    }
    
    // Play & instantly pause to clear out any blank frame caching quirks (Crucial for Safari/Mobile Chrome)
    try {
      await videoEl.play();
      videoEl.pause();
    } catch(e) { /* Autoplay block bypass */ }

    const canvas = document.createElement('canvas');
    const ctx = canvas.getContext('2d');
    const frames = [];

    try {
      const dur = videoEl.duration;
      if (!dur || !isFinite(dur)) { throw new Error('Cannot read video duration parameters.'); }

      // 3 High-Speed Structural Checkpoints
      const timestamps = [
        dur * 0.35,      // Part 1: Backswing
        dur * 0.70,      // Part 2: Swing/Impact
        dur * 0.95       // Part 3: Follow-Through
      ];

      // Maintain exact aspect ratio while scaling layout resolution down to optimize transmission
      const maxDimension = 480; 
      let scale = 1;
      if (videoEl.videoWidth > maxDimension || videoEl.videoHeight > maxDimension) {
        scale = maxDimension / Math.max(videoEl.videoWidth, videoEl.videoHeight);
      }
      canvas.width  = Math.floor(videoEl.videoWidth * scale);
      canvas.height = Math.floor(videoEl.videoHeight * scale);

      for (const t of timestamps) {
        await seekTo(videoEl, t);
        // Clean frame clear
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        ctx.drawImage(videoEl, 0, 0, canvas.width, canvas.height);
        
        // Quality drop to 0.6 reduces Base64 data character overhead by roughly 60%
        const dataUrl = canvas.toDataURL('image/jpeg', 0.6); 
        frames.push(dataUrl.split(',')[1]); 
      }
      resolve(frames);
    } catch (err) {
      reject(err);
    }
  });
}

function seekTo(videoEl, time) {
  return new Promise(res => {
    const onSeeked = () => {
      videoEl.removeEventListener('seeked', onSeeked);
      // Give the hardware dynamic renderer an extra 40ms to draw the actual pixel layout
      setTimeout(res, 40); 
    };
    videoEl.addEventListener('seeked', onSeeked);
    videoEl.currentTime = time;
  });
}

function buildUnifiedPayload(frames, promptText) {
  const labels = ['Backswing','Swing / Impact','Follow-Through'];
  const content = [];
  frames.forEach((b64, i) => {
    content.push({ type: 'text', text: `Frame ${i+1} — ${labels[i]}:` });
    content.push({ type: 'image', source: { type: 'base64', media_type: 'image/jpeg', data: b64 } });
  });
  content.push({ type: 'text', text: promptText });
  return content;
}

function parseSafeJSON(txt) {
  try {
    // Cleans out markdown code fences or hidden characters sometimes introduced by backend proxies
    const cleaned = txt.replace(/```json|```/g,'').trim();
    return JSON.parse(cleaned);
  } catch (e) {
    throw new Error("AI engine returned parsing formatting irregularities.");
  }
}
